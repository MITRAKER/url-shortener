# Nginx in front of the app instances: a reverse proxy and load balancer.
# docker-compose.yml mounts this file into the unprivileged Nginx image, whose
# main nginx.conf includes it inside its `http { }` block.
# LEARNING.md (lesson 4) explains every setting.

# Don't tell the world which Nginx version we run.
server_tokens off;

# Docker's built-in DNS server. The name "app" resolves to every instance of
# the app service; asking again every 10 s notices instances that come and go.
resolver 127.0.0.11 valid=10s ipv6=off;

# One log line per request, with the instance that answered and the timings.
log_format balanced '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr time=${request_time}s '
                    'upstream_time=${upstream_response_time}s';

upstream app_instances {
    # Shared memory for the list of instances, which "resolve" keeps current.
    zone app_instances 64k;
    # Round-robin, the default: each request goes to the next instance.
    # max_fails, fail_timeout: after 3 failed tries within 10 s, an instance
    # is skipped for 10 s (a "passive" health check: real requests are the probes).
    server app:8000 resolve max_fails=3 fail_timeout=10s;
    # Reuse connections to the instances instead of opening one per request:
    # up to 16 idle ones per Nginx worker process.
    keepalive 16;
    # Close idle ones after 60 s. The app waits longer (65 s, see Dockerfile),
    # so it never closes a connection just as Nginx sends a request on it.
    keepalive_timeout 60s;
}

server {
    listen 8080;
    access_log /dev/stdout balanced;
    # The app refuses bodies over 16 KB (app/limits.py); refusing them here
    # saves the trip.
    client_max_body_size 16k;

    location / {
        proxy_pass http://app_instances;
        # Both needed to reuse upstream connections (keepalive above).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # We are the first server a client reaches, so nothing in the client's
        # own X-Forwarded-For can be trusted: replace it with the address we
        # see. (A proxy behind another, trusted proxy would append to it.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every wait has a limit (NASA/JPL rule 2). Connecting to an instance
        # on the same network is instant, so after 2 s it is down. Reading
        # waits 30 s, longer than the app's own worst case (up to 10 s for a
        # database connection, then 5 s per query).
        proxy_connect_timeout 2s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # If an instance fails, try another one: at most 2 tries within 10 s.
        # Nginx retries only GET and HEAD, never POST: a POST is not
        # idempotent, and running it twice could create two links.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }
}

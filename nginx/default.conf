# Nginx in front of the app instances: a reverse proxy and load balancer.
# docker-compose.yml mounts this file into the unprivileged Nginx image, whose
# main nginx.conf includes it inside its `http { }` block.
# LEARNING.md (lesson 4) explains every setting.

# Don't tell the world which Nginx version we run.
server_tokens off;

# Docker's built-in DNS server. The name "app" resolves to every instance of
# the app service; asking again every 10 s notices instances that come and go.
resolver 127.0.0.11 valid=10s ipv6=off;

# One log line per request, with the instance that answered and the timings.
log_format balanced '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr time=${request_time}s '
                    'upstream_time=${upstream_response_time}s';

upstream app_instances {
    # Shared memory for the list of instances, which "resolve" keeps current.
    zone app_instances 64k;
    # Round-robin, the default: each request goes to the next instance.
    # max_fails, fail_timeout: after 3 failed tries within 10 s, an instance
    # is skipped for 10 s (a "passive" health check: real requests are the probes).
    server app:8000 resolve max_fails=3 fail_timeout=10s;
    # Reuse connections to the instances instead of opening one per request:
    # up to 16 idle ones per Nginx worker process.
    keepalive 16;
    # Close idle ones after 60 s. The app waits longer (65 s, see Dockerfile),
    # so it never closes a connection just as Nginx sends a request on it.
    keepalive_timeout 60s;
}

server {
    listen 8080;
    access_log /dev/stdout balanced;
    # The app refuses bodies over 16 KB (app/limits.py); refusing them here
    # saves the trip.
    client_max_body_size 16k;

    # How to talk to the instances. Set at this level, so both locations
    # below use the same settings.

    # Both needed to reuse upstream connections (keepalive above).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The Host header as the client sent it, port included: the app builds
    # some redirects from it (/docs/ sends you to /docs). $host would drop
    # the port, and those redirects would lead to the default port instead.
    proxy_set_header Host $http_host;
    # We are the first server a client reaches, so nothing in the client's
    # own X-Forwarded-For can be trusted: replace it with the address we
    # see. (A proxy behind another, trusted proxy would append to it.)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Every wait has a limit (NASA/JPL rule 2). Connecting to an instance
    # on the same network is instant, so after 2 s it is down. Reading
    # waits 30 s. That limits the client's wait, not the instance's: after
    # 30 s the client gets a 504, while the instance's thread works on until
    # it is done or one of the app's own limits stops it (such as 10 s to
    # wait for a free database connection, or 5 s per query). A database
    # that is alive but stuck (a paused container, say) trips none of them
    # on a connection that is already open: the thread waits until the
    # database answers.
    proxy_connect_timeout 2s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # If an instance fails, try another one: 2 tries, and no new one after
    # 10 s. (A try whose kept-alive connection breaks isn't counted: see
    # @once_more.) A GET or HEAD that still ends in a 502 made by Nginx gets
    # a second chance (@once_more, below). A request whose last try timed
    # out ends in a 504, with no second chance.
    # Nginx never retries a POST that reached an instance: a POST is not
    # idempotent, and running it twice could create two links. (A POST that
    # couldn't even connect is retried: no instance saw it.)
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Metrics are for Prometheus, which asks each instance directly on the
    # internal network. From outside, there is nothing here. ("=" matches
    # this exact path, after Nginx has decoded it: /%6Detrics is caught too.)
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app_instances;
        # A 502 made by Nginx itself: no instance answered. (One may have
        # received the request and died before answering. A 502 from the app
        # would pass through untouched, but the app never sends one.)
        error_page 502 = @once_more;
    }

    # When "resolve" changes the list of instances (one stopped, and DNS
    # no longer names it), a retry that was waiting on the stopped instance
    # can't pick another one: its request started with the old list, so
    # Nginx answers 502 ("no live upstreams"). Asked once more, it uses the
    # new list, and succeeds. Only GET and HEAD, which may be repeated.
    location @once_more {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 502;
        }
        proxy_pass http://app_instances;
        # One try, not 2 more: with the 2 tries above, a GET or HEAD usually
        # reaches the instances at most 3 times. Nginx gives a try back when
        # its kept-alive connection breaks, as when an instance dies
        # mid-answer, so the hard limit is each instance once per pass, with
        # 10 s for each pass: 6 tries with 3 instances (LEARNING.md, lesson 4).
        proxy_next_upstream_tries 1;
    }
}

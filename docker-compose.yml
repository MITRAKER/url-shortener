# The whole system, as in production but on one machine:
#
#   client ──▶ nginx (port 8000) ──▶ app × 3 ──▶ redis, db
#                                                  │
#                         clicks, as a Redis stream ▼
#                                   worker ──▶ db (counts them in batches)
#
#   prometheus (port 9090) asks every app instance and the worker for their
#   metrics every 15 s; grafana (port 3000) draws them.
#
# `migrate` applies the database migrations once, before any app instance
# or the worker starts. Every image is pinned by digest, like the base image
# in the Dockerfile; Dependabot keeps the digests current. Ports are open to
# this machine only (127.0.0.1), except Nginx's: the one door for clients.

services:
  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 probes over TCP like the app does. On first start, the
      # image runs a temporary server that only listens on a Unix socket while
      # it creates the database; a socket probe would call that "healthy".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d shortener"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    # The cache, the rate limits, and the clicks waiting to be counted. A fixed
    # memory budget (NASA/JPL rule 3). When it is full, Redis evicts the least
    # frequently used keys that expire anyway (cache entries, rate limits),
    # never the click stream, which doesn't expire: evicting it would lose
    # clicks without a word. With nothing left to evict, Redis refuses new
    # clicks, and the app counts them in PostgreSQL instead (app/clicks.py).
    # The append-only file keeps the stream across restarts; it goes to disk
    # every second, so a crash of the whole machine loses one second at most.
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lfu
      - --save
      - ""
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    image: url-shortener-app
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shortener
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: url-shortener-app
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      # Believe X-Forwarded-For only from Nginx (its fixed address is below).
      TRUSTED_PROXIES: 10.89.0.10
    # No "ports:" on purpose: the instances can only be reached through Nginx.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Start an instance again whenever it stops by itself: when it crashed,
    # could not reach the database at startup, or gave up its instance
    # number (app/instances.py). `docker compose stop` still stops it.
    restart: unless-stopped
    # The image's HEALTHCHECK tells Compose (and Nginx's depends_on) when it's ready.

  worker:
    build: .
    image: url-shortener-app
    # Counts the clicks waiting in the Redis stream (app/worker.py). One is
    # enough; a second one would be safe, but would only waste work.
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Its metrics are on port 8001, for Prometheus only: no "ports:" either.
    restart: unless-stopped
    healthcheck:
      # Healthy while it goes round its loop (a heartbeat file, see
      # app/heartbeat.py). The image's own check asks for /health over HTTP,
      # which the worker doesn't serve.
      test: ["CMD", "python", "-m", "app.heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine@sha256:f5116ed4606f3eb015dd4a8e28cb9b351476dc0ad4bc6e9f93b19cec130cdf03
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8080"
    networks:
      default:
        ipv4_address: 10.89.0.10
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # Healthy once Nginx answers and can reach at least one instance.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Collects the metrics and checks the alerts (monitoring/prometheus).
  # See them at http://localhost:9090: Status > Targets, and Alerts.
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Keep a week of history, at most 1 GB (NASA/JPL rule 3).
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Dashboards: http://localhost:3000. Anyone on this machine may look;
  # changing anything needs the admin login (admin, and GRAFANA_PASSWORD,
  # or "admin": Grafana then asks for a new one).
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/url-shortener.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  # The load test (loadtest/redirects.js). Not started by `up`: run it with
  # `make loadtest`, or `docker compose run --rm k6`.
  k6:
    image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
    profiles: [loadtest]
    command: ["run", "/scripts/redirects.js"]
    environment:
      BASE_URL: http://nginx:8080
      # The load, overridable from the command line: `-e RATE=500`, and so on.
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-1m}
      LINKS: ${LINKS:-100}
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      nginx:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # A fixed network, so that Nginx can have a fixed address for
        # TRUSTED_PROXIES. Other containers get addresses from the upper half.
        - subnet: 10.89.0.0/24
          ip_range: 10.89.0.128/25

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:

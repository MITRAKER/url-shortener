services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 probes over TCP like the app does. On first start, the
      # image runs a temporary server that only listens on a Unix socket while
      # it creates the database; a socket probe would call that "healthy".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d shortener"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # A pure cache: a fixed memory budget (NASA/JPL rule 3), evict the least
    # frequently used keys when it is full, and no saving to disk.
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lfu
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # If the app still can't reach the database at startup, start it again.
    restart: on-failure
    # The image's HEALTHCHECK lets `docker compose up --wait` know when we're ready.

volumes:
  pgdata:

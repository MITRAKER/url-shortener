# Continuous integration: runs on every pull request, every push to main,
# and once a day. A pull request should only be merged when every job is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Daily, as NASA/JPL rule 10 asks: new vulnerabilities are published
    # every day, even when our own code does not change.
    - cron: "23 5 * * *"
  workflow_dispatch:
  # Lets the release workflow run this whole pipeline before publishing.
  workflow_call:

# Least privilege: jobs may only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, format, types, Power of Ten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # A lock file with hashes: pip installs exactly these files or fails.
      - run: pip install --require-hashes -r requirements-dev.txt
      # The same hooks you run locally: Ruff, mypy, the Power of Ten checker,
      # actionlint, hadolint and file hygiene checks. They run the tools that
      # the step above installed, so pre-commit has nothing to download or cache.
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: SQLite
            database-url: ""
          - database: PostgreSQL
            database-url: postgresql+psycopg://app:app@localhost:5432/shortener_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: shortener_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U app -d shortener_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # A lock file with hashes: pip installs exactly these files or fails.
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Run tests (fails below 95% coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
        env:
          TEST_DATABASE_URL: ${{ matrix.database-url }}
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.database }}
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      # Checks every locked package, indirect ones included, against the Python
      # vulnerability database. --disable-pip: audit the lock files as written,
      # without resolving them again.
      - run: pip-audit --strict --disable-pip -r requirements.txt -r requirements-dev.txt

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build and start the whole stack (waits until healthy)
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test against the running containers
        run: python scripts/smoke_test.py http://localhost:8000
      - name: Show container logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

# Alembic: database migrations. `alembic upgrade head` (or `make migrate`)
# applies every migration in app/migrations/versions/ that the database has
# not seen yet. The database URL is not in this file: app/migrations/env.py
# reads DATABASE_URL, exactly like the app.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
path_separator = os
# New files are named after their revision: 0003_add_something.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
